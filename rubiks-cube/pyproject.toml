[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rubiks-cube"
version = "0.1.0"
description = "Interactive 3D Rubik's cube with Kociemba solver, scrambler, timer, and keyboard controls."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Sean Connolly"}
]

dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
solver = ["kociemba"]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
rubiks-cube = "rubiks_cube.cube_viz:run_rubiks_cube"

[tool.setuptools.packages.find]
where = ["."]
include = ["rubiks_cube*"]
