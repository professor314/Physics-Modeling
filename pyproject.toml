[project]
name = "modeling-motion"
version = "1.0.0"
description = "Physics simulations from the Modeling Motion program (2004) — springs, gravity, epidemics, numerical integration, and a Rubik's cube."
authors = [
    { name = "Sean Connolly" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.7"
dependencies = [
    "vpython>=7.0",
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
